name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'projects/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig.json'
      - 'karma.conf.js'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: |
          npx ng test ui --no-watch --code-coverage --browsers=ChromeHeadless 2>&1 | tee test-output.txt
          # Fail the step if tests failed (grep for FAILED or check for SUCCESS)
          grep -q 'TOTAL.*SUCCESS' test-output.txt

      - name: Generate coverage summary
        if: always()
        run: |
          echo '## :bar_chart: Code Coverage Report' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          if [ -f test-output.txt ]; then
            COVERAGE=$(sed -n '/Coverage summary/,/={10,}/p' test-output.txt | sed 's/\x1b\[[0-9;]*m//g')
            if [ -n "$COVERAGE" ]; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$COVERAGE" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo ':warning: No coverage summary found in test output.' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo ':warning: No test output captured.' >> $GITHUB_STEP_SUMMARY
          fi


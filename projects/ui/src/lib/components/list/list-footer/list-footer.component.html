@if(isHidden() == false) {
    <div class="footer-content">
        @if(showTotal()) {
            <div class="footer-text">
                {{ itemCount() }} {{ itemCount() === 1 ? 'item' : 'items' }}
                @if(hasSearchTerm()) {
                    <span class="filtered-count">({{ filteredOutCount() }} filtered)</span>
                }
                @if(sortLabel()) {
                    <span class="sort-label">{{ sortLabel() }}</span>
                }
            </div>
        }
        <div class="footer-slot">
            <ng-content select="ui-list-item-kpi"></ng-content>
        </div>
    </div>
}

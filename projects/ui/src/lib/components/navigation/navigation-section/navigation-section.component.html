@if(isHidden() == false) {
    <div class="ui-nav-section">
        <div class="ui-nav-section-title">
            {{ label() }}
        </div>

        @for (item of sectionItems(); track $index) {
        <div class="ui-nav-section-item no-select"
            [class.active]="item.isActive"
            (click)="itemClicked(item)"
        >
            
                {{ item.label }}
            
        </div>
        }
    </div>
}

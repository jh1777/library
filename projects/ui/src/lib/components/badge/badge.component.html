@if(hidden() == false) {
    @if(label()) {
        <div class="csgp-badge-container"
            [class.csgp-badge-container-error]="state() == 2"
            [class.csgp-badge-container-warning]="state() == 1"
            [class.csgp-badge-container-success]="state() == 3"
        >
            {{ label() }}
            @if (value()) {
                <ng-container *ngTemplateOutlet="badgevalue"></ng-container>
            }
        </div>
    } @else {
        @if (value()) {
            <ng-container *ngTemplateOutlet="badgevalue"></ng-container>
        }
    }

    <ng-template #badgevalue>
        <div class="csgp-badge"
            [class.csgp-badge-error]="state() == 2"
            [class.csgp-badge-warning]="state() == 1"
            [class.csgp-badge-success]="state() == 3"
            [class.csgp-badge-small]="size() == 1"
            [class.csgp-badge-medium]="size() == 2"
            [class.csgp-badge-large]="size() == 3"
        >
            {{ value() }}
        </div>
    </ng-template>
}

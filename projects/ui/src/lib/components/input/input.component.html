@if(isHidden() == false) {
   
<div class="ui-input">
    @if (label()) {
        <label class="input-label">{{ label() }}</label>
    }
    <input
      [type]="type()"
      [placeholder]="valuePlaceholder()"
      [disabled]="isDisabled()"
      [value]="value()"
      (input)="setValue($event)"
      (blur)="onTouched()"
      class="input-box"
    />
  </div>
}

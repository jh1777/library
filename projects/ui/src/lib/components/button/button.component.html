@if(hidden() == false) {
    <div class="ui-badge">
        <ng-content select="ui-badge"></ng-content>
    </div>
    <div 
        class="ui-button"
        [title]="tooltip()"
        [class.disabled]="disabled() == true"
        [class.simple-primary]="style() == 0"
        [class.simple-destructive]="style() == 6"
        [class.simple]="style() == 0 || style() == 6"
        [class.bordered]="style() > 0 && style() < 6"
        [class.primary]="style() == 1"
        [class.secondary]="style() == 2"
        [class.outline]="style() == 3"
        [class.destructive]="style() == 4 || style() == 6"
        [class.confirm]="style() == 5"
        [class.white-mode]="whiteMode() == true"
        (click)="onClick.emit(id() ?? label())"
    >
    @if(icon() != null) {
        <cds-icon [attr.shape]="icon()" size="18"></cds-icon>
    }
    {{ label() }}
    </div>
}

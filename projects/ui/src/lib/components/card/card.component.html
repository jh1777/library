@if(hidden() == false) {
    <div 
        class="ui-card"
        [class.attention]="style() == 1"
        [class.error]="style() == 2"
        [class.success]="style() == 3"
    >
        <div 
            class="ui-card-header"
            [class.attention]="style() == 1"
            [class.error]="style() == 2"
            [class.success]="style() == 3"
        >
            @if(isLoading() == false) {
                {{ header() }}
                <div class="ui-card-header-right">
                    <ng-content select="ui-button[slot=header-right]"></ng-content>
                    <ng-content select="ui-switch[slot=header-right]"></ng-content>
                </div>
            } @else {
                <div class="loading pulse">
                    @for (_ of [].constructor(4); track $index) {
                        {{ placeholder }}
                    }
                </div>
            }
        </div>
        
        <ng-content select="ui-card-section-basic"></ng-content>
    </div>
}

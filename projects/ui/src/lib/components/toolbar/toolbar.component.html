@if(isHidden() == false) {
    <div class="ui-toolbar-left">
        @if(text() && showToolbarText() == true) {
            <div class="ui-toolbar-left-text">
                {{ text() }}
            </div>
        }
        <ng-content select="div[slot=left]"></ng-content>
        <ng-content select="ui-badge[slot=left]"></ng-content>
        <ng-content select="ui-value-tile[slot=left]"></ng-content>
        <ng-content select="ui-button[slot=left]"></ng-content>
        <ng-content select="ui-button-group[slot=left]"></ng-content>
        <ng-content select="ui-switch[slot=left]"></ng-content>
    </div>
    <div class="ui-toolbar-right">
        <ng-content select="div[slot=right]"></ng-content>
        <ng-content select="ui-badge[slot=right]"></ng-content>
        <ng-content select="ui-value-tile[slot=right]"></ng-content>
        <ng-content select="ui-switch[slot=right]"></ng-content>
        <ng-content select="ui-button-group[slot=right]"></ng-content>
        <ng-content select="ui-button[slot=right]"></ng-content>
    </div>
}

@if(isHidden() == false) {
    @if(isLoading() == true) {
        <div class="ui-window-loading no-select no-scroll no-click">
            <ui-spinner [text]="loadingText()" [size]=2></ui-spinner>
        </div>
    }
    <div 
        class="ui-window"
        [class.no-scroll]="isLoading() == true"
        [class.no-select]="isLoading() == true"
        [class.no-click]="isLoading() == true"
    >   
        <ng-content select="ui-menu-bar"></ng-content>
        <ng-content select="ui-content"></ng-content>
    </div>
}

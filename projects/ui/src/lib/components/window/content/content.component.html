@if(hidden() == false) {
    @if(isLoading() == true) {
        <div class="ui-content-loading no-select no-scroll">
            <div class="ui-spinner"></div>
            {{ loadingText() }}
        </div>
    }
    <div 
        class="ui-content"
        [class.no-scroll]="isLoading() == true"
        [class.no-select]="isLoading() == true"
    >   
        <ng-content></ng-content>
    </div>
}

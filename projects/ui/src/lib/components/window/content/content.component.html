@if(isHidden() == false) {
    @if(isLoading() == true) {
        <div class="ui-content-loading no-select no-scroll">
            <ui-spinner [text]="loadingText()" [size]=2></ui-spinner>
        </div>
    }
    <div 
        class="ui-content"
        [class.no-scroll]="isLoading() == true"
        [class.no-select]="isLoading() == true"
    >   
        <ng-content></ng-content>
    </div>
}

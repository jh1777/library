@if(isHidden() == false) {
    
    <div 
        class="ui-content"
        [class.no-scroll]="isLoading() == true"
        [class.no-select]="isLoading() == true"
    >   
        @if(bannerMessage()) {
            <span class="ui-content-banner {{ bannerMessage().type }}">
                <span class="text">
                    {{ bannerMessage().text }}
                </span>
                <span class="right-aligned">
                    @if(bannerMessage().action) {
                        <ui-button 
                            (onClick)="onActionClick()"
                            [label]="bannerMessage().actionLabel ?? 'Action'" 
                            [style]="actionButtonStyle(bannerMessage())"
                        ></ui-button>
                    }
                    @if(bannerMessage().showCloseButton) {
                        <span class="close-button" (click)="dismissMessage()">
                            <fa-icon [icon]="closeIcon()"></fa-icon>
                        </span>
                    }
                </span>
            </span>
        }
        <ng-content></ng-content>
    </div>
    @if(isLoading() == true) {
        <div class="ui-content-loading no-select no-scroll">
            <ui-spinner [text]="loadingText()" [size]=2></ui-spinner>
        </div>
    }
}

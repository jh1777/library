@if(hidden() == false) {
 
    <div class="ui-accordion">
        @if(hasError() == true) {
            <ui-error class="ui-accordion-error" [errorMessage]="errorMessage()"></ui-error>
        } @else {
            <div class="ui-accordion-panel no-select" 
                (click)="disabled() == true ? null : isCollapsed.set(!isCollapsed())"
                [class.first-panel]="isFirst() == true"
                [class.last-panel]="isLast() == true"
                [class.active-panel]="isCollapsed() == false"
                [class.disabled]="disabled() == true"
                [class.no-click]="disabled() == true"
                >
                <ui-collapse-button 
                    [disabled]="disabled()" [(isCollapsed)]="isCollapsed" 
                    (click)="disabled() ? null : isCollapsed.set(!isCollapsed())">
                </ui-collapse-button>
                <ng-content select="ui-accordion-panel-header"></ng-content>
                
            </div>
            <div [@expandCollapse]="isCollapsed()" style="overflow: hidden; display: block;">
                <div class="ui-accordion-panel-content">
                    <ng-content></ng-content>
                </div>
            </div>
        }
    </div>
}

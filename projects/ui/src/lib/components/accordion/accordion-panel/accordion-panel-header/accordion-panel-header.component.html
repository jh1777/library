@if(isHidden() == false) {
    
   {{ label() }}
   @if(tooltip()) {
    <fa-icon [icon]="infoIcon()" [attr.title]="tooltip()"></fa-icon>
   }
    <div 
        class="ui-accordion-panel-header-right"
        [class.disabled]="disabledPanel() == true"
        [class.no-click]="disabledPanel() == true"
    >
        <ng-content select="ui-button"></ng-content>
        <ng-content select="ui-switch"></ng-content>
        <ng-content select="ui-badge"></ng-content>

        @if(style() > 0 && style() < 4) {

            <fa-icon
                [style.color]="
                    style() == 1
                    ? 'var(--attention-color)'
                    : style() == 2
                        ? 'var(--error-color)'
                        : style() == 3
                            ? 'var(--success-color)'
                            : ''
                "
                [icon]="
                    style() == 1
                    ? warningIcon()
                    : style() == 2
                        ? errorIcon()
                        : style() == 3
                            ? successIcon()
                            : ''
                "
                style="font-size: 20px;"
            ></fa-icon> 
        }
    </div>
}

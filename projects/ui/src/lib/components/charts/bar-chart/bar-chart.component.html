@if(isHidden() == false) {
  @if(dataSet().label) {
    <div class="chart-title">{{ dataSet().label }}</div>
  }
  <svg [attr.width]="resolvedSvgWidth()" [attr.height]="height() + 50">
    @for (d of dataSet().data; track d; let i = $index) {
      <!-- Balken -->
      <rect
        [attr.x]="getBarSlotAnchorX(i) + barSlotCenterOffset()- (barWidth()/2)"
        [attr.y]="height() - (d.value / maxValue() * (height() - heightOffset()))"
        [attr.width]="barWidth()"
        [attr.height]="d.value / maxValue() * (height() - heightOffset())"
        [attr.fill]="d.color || barColor()"
        [attr.fill-opacity]="d.opacity ? d.opacity : 1"
        [attr.rx]="roudedCorners()"
        [attr.ry]="roudedCorners()"
      >
        @if (animations()) {
            <!-- Balken-Animation -->
            <animate
              attributeName="height"
              from="0"
              [attr.to]="d.value / maxValue() * (height() - heightOffset())"
              dur="0.4s"
              fill="freeze"
            />
            <animate
              attributeName="y"
              [attr.from]="height()"
              [attr.to]="height() - (d.value / maxValue() * (height() - heightOffset()))"
              dur="0.4s"
              fill="freeze"
            />
        }
      </rect>

      <!-- Wert über Balken -->
      @if (showValue()) {
        <text
          [attr.x]="getBarSlotAnchorX(i) + barSlotCenterOffset()"
          [attr.y]="height() - (d.value / maxValue() * (height() - heightOffset())) - (showPercentage() ? 22 : 10)"
          text-anchor="middle"
          font-size="12"
          font-weight="bold"
          [attr.fill]="textColor()"
        >
          {{ d.value }}
        </text>
      }
      @if (showPercentage()) {
        <text
          [attr.x]="getBarSlotAnchorX(i) + barSlotCenterOffset()"
          [attr.y]="height() - (d.value / maxValue() * (height() - heightOffset())) - (showValue() ? 7 : 10)"
          text-anchor="middle"
          font-size="12"
          [attr.font-weight]="showValue() ? 'normal' : 'bold'"
          [attr.fill-opacity]="showValue() ? 0.6 : 1"
          [attr.fill]="textColor()"
        >
          {{ showValue() ? '(' + getPercentage(d.value) + ')' : getPercentage(d.value) }}
        </text>
      }

      @if(showXAxisLabels()) {
        <!-- Label unten -->
        <text
          [attr.x]="getBarSlotAnchorX(i) + barSlotCenterOffset()"
          [attr.y]="height() + (showXAxis() ? 20 : 15)"
          text-anchor="middle"
          font-size="10"
          font-weight="bold"
          [attr.fill]="textColor()"
        >
          {{ d.label }}
        </text>
      }
      <!-- Show X-Axis line ticks-->
      @if (showXAxis()) {
        <line
          [attr.x1]="getBarSlotAnchorX(i) + barSlotCenterOffset()"
          [attr.y1]="height()"
          [attr.x2]="getBarSlotAnchorX(i) + barSlotCenterOffset()"
          [attr.y2]="height() + 7"
          stroke="black"
          opacity="0.3"
        />
      }
    }
    
    @if (showXAxis()) {
      <!-- X-Axis line -->
      <line
        x1="0"
        [attr.y1]="height()"
        [attr.x2]="chartWidth()"
        [attr.y2]="height()"
        stroke="black"
        opacity="0.3"
      />
    }
  </svg>
}

@if(hidden() == false) {
    <div class="ui-switch" 
        [attr.title]="tooltip()" 
        (click)="handleClickEvent($event)">
        <div class="ui-switch-toggle"
            [class.knob-on]="state() == true"
            [class.knob-off]="state() == false"
            >
            <div [@switchPosition]="state()" class="ui-switch-toggle-knob">
            </div>
        </div>
        @if(label()) {
            <div class="ui-switch-label">
                {{ label() }}
            </div>
        }
    </div>
}

@if(isHidden() == false) {
    <div class="menu-item" 
        [class.selected]="isSelected()"
        [class.disabled]="isDisabled()"
        (click)="handleOptionClick($event)">

        @if(icon()) {
            <fa-icon [icon]="icon()!"></fa-icon>
        }
        <span>{{ label() }}</span>

        <div class="align-right">
            <ng-content select="ui-button"></ng-content>
            <ng-content select="ui-switch"></ng-content>
            <ng-content select="ui-badge"></ng-content>
        </div>
    </div>
}

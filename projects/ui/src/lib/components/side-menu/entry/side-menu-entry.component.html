@if(isHidden() == false) {
    <div class="menu-item" 
        [class.selected]="isSelected()"
        [class.disabled]="isDisabled()"
        (click)="handleOptionClick($event)">

        @if(icon()) {
            
            <fa-icon class="menu-item-icon" 
                [class.selected]="isSelected()"
            
            [icon]="icon()!"
            ></fa-icon>
        }
        <span class="label">{{ label() }}</span>

        <div class="align-right">
            <ng-content select="ui-button"></ng-content>
            <ng-content select="ui-switch"></ng-content>
            <ng-content select="ui-badge"></ng-content>
            @if(hasSubEntries()) {
                <ui-collapse-button [(isCollapsed)]="isExpanded" (onClick)="handleExpandToggle($event)"></ui-collapse-button>
            }
        </div>
    </div>

    @if (isExpanded()) {
        <div class="sub-menu">
            <ng-content select="ui-side-menu-sub-entry"></ng-content>
        </div>
    }
}

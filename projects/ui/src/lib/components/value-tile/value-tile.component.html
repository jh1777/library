@if(hidden() == false) {

    @if(hasError() == true) {
        <ui-error class="ui-value-tile-error" [errorMessage]="errorMessage()"></ui-error>
    } @else {

        @if (isLoading() == true) {
            <div class="ui-value-tile-key loading no-select pulse">
                <div>
                    @for (_ of [].constructor(4); track $index) {
                        &nbsp;
                    }
                </div>
            </div>
            <div class="ui-value-tile-value loading no-select pulse">
                <div>
                    @for (_ of [].constructor(6); track $index) {
                        &nbsp;
                    }
                </div>
            </div>
        }
        @else {
            <div class="ui-badge">
                <ng-content select="ui-badge"></ng-content>
            </div>
            <div 
                class="ui-value-tile-key"
                [class.attention]="style() == 1"
                [class.error]="style() == 2"
                [class.success]="style() == 3"
            >
                {{ key() }}
            </div>
            <div
                class="ui-value-tile-value"
                [class.attention]="style() == 1"
                [class.error]="style() == 2"
                [class.success]="style() == 3"
            >
                {{ value() }}
                @if(tooltip()) {
                    <cds-icon shape="info-standard" size="13"
                        [attr.title]="tooltip()"
                        [class.attention]="style() == 1"
                        [class.error]="style() == 2"
                        [class.success]="style() == 3"
                    ></cds-icon>
                }
                <ng-content 
                    select="ui-button"
                ></ng-content>
            </div>
        }
    }
}

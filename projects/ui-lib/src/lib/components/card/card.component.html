@if(hidden() == false) {
    <div class="csgp-card">
        <div class="csgp-card-header">
            {{ title() }}

            <div style="margin-left: auto;">
                <ng-content select="[btnHeader]"></ng-content>
            </div>
            <!-- <ng-content select="ui-button-v2[slot=btn01]"></ng-content> -->
        </div>
        <div class="csgp-card-content">
            {{ text() }}
        </div>
        <div class="csgp-card-footer">
            <!-- <ng-content select="ui-button-v2[slot=btn02]"></ng-content> -->
            <ng-content select="[btnFooter]"></ng-content>
        </div>
    </div>
}

<div class="csgp-badge">
    <ng-content select="ui-badge"></ng-content>
</div>
<div 
    class="csgp-value-tile-key"
    [class.attention]="state() == 1"
    [class.error]="state() == 2"
    [class.success]="state() == 3"
>
    {{ key() }}
</div>
<div
    class="csgp-value-tile-value"
    [class.attention]="state() == 1"
    [class.error]="state() == 2"
    [class.success]="state() == 3"
>
    {{ value() }}
    <ng-content 
        select="ui-button-v2"
    ></ng-content>
</div>

<div 
    *ngIf="(data.icon || data.label) && !data.href && !data.isLoading"
    class="csgp-button-wrapper"
    [class.disabled]="data.disabled"
    [ngClass]="data.filledStyle ? 'bordered' : ''"
    [style.border]="data.filledStyle ? data.borderWidth : ''"
    [style.border-color]="(data.filledStyle == true && data.borderColor && !data.disabled) ? data.borderColor : (data.color && !data.disabled ? data.color : 'var(--csgp-button-text-color)')"
    [style.background-color]="(data.filledStyle == true && data.backgroundColor && !data.disabled) ? data.backgroundColor : ''"
    [style.color]="!data.disabled ? data.color : ''"
    [attr.title]="data.tooltip"
    (click)="buttonClicked($event)"
    (mouseenter)="mouseEnterEvent($event)"
    (mouseleave)="mouseLeaveEvent($event)"
    ><clr-icon 
        *ngIf="data.icon"
        [ngClass]="data.disabled ? 'disabled' : ''"
        [style.color]="!data.disabled && data.color ? data.color : ''"
        [attr.shape]="data.icon"
        [attr.size]="data.iconSize"
    ></clr-icon>
    <div *ngIf="data.label">{{ data.label }}</div>
</div>

<a
    *ngIf="(data.icon || data.label) && data.href && !data.isLoading"
    [attr.href]="data.href"
    class="csgp-button-wrapper"
    [class.disabled]="data.disabled"
    [ngClass]="data.filledStyle ? 'bordered' : ''"
    [style.border]="data.filledStyle ? data.borderWidth : ''"
    [style.border-color]="(data.filledStyle == true && data.borderColor && !data.disabled) ? data.borderColor : (data.color && !data.disabled ? data.color : 'var(--csgp-button-text-color)')"
    [style.background-color]="(data.filledStyle == true && data.backgroundColor && !data.disabled) ? data.backgroundColor : ''"
    [style.color]="!data.disabled ? data.color : ''"
    [attr.title]="data.tooltip"
    (click)="buttonClicked($event)"
    (mouseenter)="mouseEnterEvent($event)"
    (mouseleave)="mouseLeaveEvent($event)"
    >
    <clr-icon 
        *ngIf="data.icon"
        [ngClass]="data.disabled ? 'disabled' : ''"
        [style.color]="!data.disabled && data.color ? data.color : ''"
        [attr.shape]="data.icon"
        [attr.size]="data.iconSize"
    ></clr-icon>
    <div *ngIf="data.label">{{ data.label }}</div>
</a>

<div 
    *ngIf="data.isLoading" 
    class="csgp-button-wrapper disabled"
    [ngClass]="data.filledStyle ? 'bordered' : ''"
    [style.border]="data.filledStyle ? data.borderWidth : ''"
    [style.border-color]="(data.filledStyle == true && data.borderColor && !data.disabled) ? data.borderColor : (data.color && !data.disabled ? data.color : 'var(--csgp-button-text-color)')"
    [style.background-color]="(data.filledStyle == true && data.backgroundColor && !data.disabled) ? data.backgroundColor : ''"
    [style.color]="!data.disabled ? data.color : ''"
    [attr.title]="data.tooltip"
>
    <clr-spinner [clrSmall]="true"></clr-spinner>
    <div *ngIf="data.isLoadingMessage">{{  data.isLoadingMessage }}</div>
</div>

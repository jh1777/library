<div class="csgp-metric-entry">

    <div *ngIf="metricEntryStore.hasError$ | async" class="error-overlay">
        <div>{{ (metricEntryStore.errorMessage$ | async) ?? 'An error occured' }}</div>
        <div *ngIf="metricEntryStore.errorShowLink$ | async" (click)="errorClicked()" class="error-link">Show Details</div>
    </div>

    <div 
        *ngIf="metricEntryStore.isLoading$ | async" 
        class="csgp-metric-entry-container-loading no-select"
        [class.pulse]="!(metricEntryStore.hasError$ | async)" 
        [class.error-blur]="metricEntryStore.hasError$ | async"
        >
        <div class="csgp-metric-entry-container-left">
            <div><ng-container *ngFor="let _ of [].constructor(7)">{{ placeholder }}</ng-container></div>
        </div>
        <div class="csgp-metric-entry-container-right">
            <div><ng-container *ngFor="let _ of [].constructor(7)">{{ placeholder }}</ng-container></div>
        </div>
    </div>

    <div 
        *ngIf="!(metricEntryStore.isLoading$ | async)"
        class="csgp-metric-entry-container" 
        [class.error-blur]="metricEntryStore.hasError$ | async"
        >
        <div class="csgp-metric-entry-container-left">
            <div class="header-text icon-container" [style]="metricEntryStore.labelStyle$ | async">{{  metricEntryStore.labelValue$ | async }}
                <clr-icon 
                    *ngIf="(metricEntryStore.labelIcon$ | async)?.source == 'clarity'" 
                    [class.icon-link]="(metricEntryStore.labelIcon$ | async)?.isClickable"
                    [attr.title]="(metricEntryStore.labelIcon$ | async)?.tooltip"
                    [attr.size]="(metricEntryStore.labelIcon$ | async)?.size"
                    [style.color]="(metricEntryStore.labelIcon$ | async)?.color"
                    [attr.shape]="(metricEntryStore.labelIcon$ | async)?.iconName"
                    (click)="iconClicked()"
                ></clr-icon>
            </div>
        </div>
        <div class="csgp-metric-entry-container-right" [style.color]="metricEntryStore.valueColor$ | async">
            <div class="measure-value">{{ metricEntryStore.value$ | async }}</div>
            <div *ngIf="metricEntryStore.valuePercent$ | async" class="measure-percent">({{  (metricEntryStore.valuePercent$ | async) * 100  }}%)</div>
        </div>
        
    </div>
    <div 
        class="csgp-metric-entry-bar"
        [style.background-color]="(metricEntryStore.isLoading$ | async) ? 'var(--metric-entry-loading-bar-bg-color)' : 'lightgrey'">
        <div class="csgp-metric-entry-bar"
            *ngIf="metricEntryStore.showPctBar$ | async"
            [style.background-color]="(metricEntryStore.valueColor$ | async) ?? 'var(--metric-entry-bar-default-color)'"
            [style.width.%]="(metricEntryStore.valuePercent$ | async) * 100">
        </div>
    </div>
</div>

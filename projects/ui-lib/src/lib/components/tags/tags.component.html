<div class="csgp-tags-group">
    <clr-icon *ngIf="showTagsIcon" class="csgp-tags-icon" shape="tags"></clr-icon>
    <!-- <clr-spinner *ngIf="isLoading" [clrSmall]="true"></clr-spinner> -->
    <ng-container *ngIf="isLoading">
        <div class="csgp-tag-item pulse" *ngFor="let _ of [].constructor(2)">
           <span *ngFor="let _ of [].constructor(15)">&nbsp;</span>
        </div>
    </ng-container>
    <ng-container *ngIf="!isLoading">
        <div 
            class="csgp-tag-item" 
            *ngFor="let tag of tags" 
            [attr.title]="tag.description" 
            (click)="tagClicked($event, tag)"
            [ngStyle]="{'cursor': enableClick ? 'pointer' : 'default'}"
            [ngClass]="{'selectable': enableClick, 'action': enableClick }"
            
            >
            <strong>{{ tag.name }}</strong>: {{ tag.value }}
            <span class="csgp-tags-buttons-group">
                <div *ngIf="showEditButton" 
                    class="csgp-tag-edit-button" 
                    title="Edit this tag" 
                    (click)="editTagClicked($event, tag)">
                    <clr-icon shape="edit" size="12"></clr-icon>
                </div>
                <div 
                    *ngIf="showDeletionButton"
                    class="csgp-tag-remove-button" 
                    title="Delete this tag" 
                    (click)="deleteTagClicked($event, tag)">
                    <clr-icon shape="trash" size="12"></clr-icon>
                </div>
            </span>
        </div>
        <div
            class="csgp-tag-item csgp-toolbutton"
            [attr.title]="moreTagsLabel"
            *ngIf="overflowAfterXItems > 0"
            (click)="tagMoreClicked($event)"
            [ngStyle]="{'cursor': enableClickMore ? 'pointer' : 'default'}"
            [ngClass]="{'selectable': enableClickMore, 'action': enableClickMore }"
        >
            &nbsp;<clr-icon shape="ellipsis-horizontal" size="15"></clr-icon>&nbsp;
        </div>
        <div
            class="csgp-tag-item csgp-toolbutton selectable action" 
            *ngIf="showAddButton"
            (click)="tagAddClicked($event)"
        >
            &nbsp;<clr-icon shape="plus" size="15"></clr-icon>&nbsp;
        </div>
    </ng-container>
</div>

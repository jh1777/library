<div class="csgp-property-grid">
    <ng-container *ngFor="let _ of [].constructor(cols); let i = index">
        <div class="csgp-property-grid-col">
            
            <!--
            Col-Index: {{ i }}
            -->

            <!-- COLS -->
            <ng-container *ngFor="let _ of [].constructor(rows); let j = index">
                <div class="csgp-property-grid-row" *ngIf="data?.items[j+(i*rows)]">
                    
                    <!--
                    Row-Index: {{ j }} <br/>
                    Index: {{ j + ( i * rows ) }}
                    -->
                    
                    <!-- ROWS -->
                    <ng-container *ngIf="data?.items[j+(i*rows)]?.component == 'KEY-VALUE-DOUBLE'">
                        <csgp-property-entry 
                            [isLoading]="data?.items[j+(i*rows)]?.isLoading"
                            [data]="data?.items[j+(i*rows)]?.data"
                            [errorData]="data?.items[j+(i*rows)]?.errorData"
                        ></csgp-property-entry>
                    </ng-container>
                    <ng-container *ngIf="data?.items[j+(i*rows)]?.component == 'METRIC-BAR'">
                        <csgp-metric-entry
                            [isLoading]="data?.items[j+(i*rows)]?.isLoading"
                            [label]="data?.items[j+(i*rows)]?.label"
                            [labelStyle]="data?.items[j+(i*rows)]?.labelStyle"
                            [labelIcon]="data?.items[j+(i*rows)]?.labelIcon"
                            [metricValue]="data?.items[j+(i*rows)]?.metricValue"
                            [metricPercent]="data?.items[j+(i*rows)]?.metricPercent"
                            [metricColor]="data?.items[j+(i*rows)]?.metricColor"
                            [errorData]="data?.items[j+(i*rows)]?.errorData"
                        ></csgp-metric-entry>
                    </ng-container>
                </div>
            </ng-container>
        </div>
    </ng-container>
</div>

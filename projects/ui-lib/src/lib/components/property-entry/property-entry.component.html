<div class="csgp-propertyentry">

    <div *ngIf="errorData?.hasError" class="error-overlay">
        <div>{{ errorData?.message ?? 'An error occured' }}</div>
        <div *ngIf="errorData?.showLink" (click)="errorClicked($event)" class="error-link">Show Details</div>
    </div>

    <div 
        *ngIf="isLoading" 
        class="csgp-propertyentry-container-loading no-select"
        [class.pulse]="!errorData?.hasError" 
        [class.error-blur]="errorData?.hasError"
        >
        <div class="csgp-propertyentry-container-left">
            <div><ng-container *ngFor="let _ of [].constructor(5)">{{ placeholder }}</ng-container></div>
            <div><ng-container *ngFor="let _ of [].constructor(3)">{{ placeholder }}</ng-container></div>
        </div>
        <div *ngIf="value || valueSubtitle" class="csgp-propertyentry-container-right">
            <div><ng-container *ngFor="let _ of [].constructor(5)">{{ placeholder }}</ng-container></div>
            <div><ng-container *ngFor="let _ of [].constructor(3)">{{ placeholder }}</ng-container></div>
        </div>
    </div>

    <div 
        *ngIf="!isLoading"
        class="csgp-propertyentry-container" 
        [class.error-blur]="errorData?.hasError"
        >
        <div class="csgp-propertyentry-container-left">
            <div class="header-text icon-container" [style]="labelStyle">{{  label }}
                <clr-icon 
                    *ngIf="labelIcon?.source == 'clarity'" 
                    [class.icon-link]="labelIcon?.isClickable"
                    [attr.title]="labelIcon?.tooltip"
                    [attr.size]="labelIcon?.size"
                    [style.color]="labelIcon?.color"
                    [attr.shape]="labelIcon?.iconName"
                    (click)="iconClicked(labelIcon)"
                ></clr-icon>
            </div>
            <div class="subtitle icon-container" [style]="subtitleStyle">{{  subtitle }}
                <clr-icon 
                    *ngIf="subtitleIcon?.source == 'clarity'" 
                    [class.icon-link]="subtitleIcon?.isClickable"
                    [attr.title]="subtitleIcon?.tooltip"
                    [attr.size]="subtitleIcon?.size"
                    [style.color]="subtitleIcon?.color"
                    [attr.shape]="subtitleIcon?.iconName"
                    (click)="iconClicked(subtitleIcon)"
                ></clr-icon>
            </div>
        </div>
        <div *ngIf="value || valueSubtitle" class="csgp-propertyentry-container-right">

            <div class="header-text icon-container" [style]="valueStyle">
                <clr-icon 
                *ngIf="valueIcon?.source == 'clarity'" 
                [class.icon-link]="valueIcon?.isClickable"
                [attr.title]="valueIcon?.tooltip"
                [attr.size]="valueIcon?.size"
                [style.color]="valueIcon?.color"
                [attr.shape]="valueIcon?.iconName"
                (click)="iconClicked(valueIcon)"
            ></clr-icon>{{ value }}</div>

            <div class="subtitle icon-container" [style]="valueSubtitleStyle">
                <clr-icon 
                *ngIf="valueSubtitleIcon?.source == 'clarity'" 
                [class.icon-link]="valueSubtitleIcon?.isClickable"
                [attr.title]="valueSubtitleIcon?.tooltip"
                [attr.size]="valueSubtitleIcon?.size"
                [style.color]="valueSubtitleIcon?.color"
                [attr.shape]="valueSubtitleIcon?.iconName"
                (click)="iconClicked(valueSubtitleIcon)"
            ></clr-icon>{{ valueSubtitle }}</div>
        </div>
    </div>
</div>

<div class="csgp-propertyentry">

    <div *ngIf="errorData?.hasError" class="error-overlay">
        <div>{{ errorData?.message ?? 'An error occured' }}</div>
        <div *ngIf="errorData?.showLink" (click)="errorClicked($event)" class="error-link">Show Details</div>
    </div>

    <div 
        *ngIf="isLoading" 
        class="csgp-propertyentry-container-loading no-select"
        [class.pulse]="!errorData?.hasError" 
        [class.error-blur]="errorData?.hasError"
        >
        <div class="csgp-propertyentry-container-left">
            <div><ng-container *ngFor="let _ of [].constructor(7)">{{ placeholder }}</ng-container></div>
            <div><ng-container *ngFor="let _ of [].constructor(4)">{{ placeholder }}</ng-container></div>
        </div>
        <div class="csgp-propertyentry-container-right">
            <div><ng-container *ngFor="let _ of [].constructor(7)">{{ placeholder }}</ng-container></div>
            <div><ng-container *ngFor="let _ of [].constructor(4)">{{ placeholder }}</ng-container></div>
        </div>
    </div>

    <div 
        *ngIf="!isLoading"
        class="csgp-propertyentry-container" 
        [class.error-blur]="errorData?.hasError"
        >
        <div class="csgp-propertyentry-container-left">
            <div class="header-text icon-container" [style]="data?.label?.style">{{  data?.label?.value }}
                <clr-icon 
                    *ngIf="data?.label?.icon?.source == 'clarity'" 
                    [class.icon-link]="data?.label?.icon?.isClickable"
                    [attr.title]="data?.label?.icon?.tooltip"
                    [attr.size]="data?.label?.icon?.size"
                    [style.color]="data?.label?.icon?.color"
                    [attr.shape]="data?.label?.icon?.iconName"
                    (click)="iconClicked(data?.label)"
                ></clr-icon>
            </div>
            <div class="subtitle icon-container" [style]="data?.subtitleLabel?.style">{{  data?.subtitleLabel?.value }}
                <clr-icon 
                    *ngIf="data?.subtitleLabel?.icon?.source == 'clarity'" 
                    [class.icon-link]="data?.subtitleLabel?.icon?.isClickable"
                    [attr.title]="data?.subtitleLabel?.icon?.tooltip"
                    [attr.size]="data?.subtitleLabel?.icon?.size"
                    [style.color]="data?.subtitleLabel?.icon?.color"
                    [attr.shape]="data?.subtitleLabel?.icon?.iconName"
                    (click)="iconClicked(data?.subtitleLabel)"
                ></clr-icon>
            </div>
        </div>
        <div class="csgp-propertyentry-container-right">

            <div class="header-text icon-container" [style]="data?.content?.style">
                <clr-icon 
                *ngIf="data?.content?.icon?.source == 'clarity'" 
                [class.icon-link]="data?.content?.icon?.isClickable"
                [attr.title]="data?.content?.icon?.tooltip"
                [attr.size]="data?.content?.icon?.size"
                [style.color]="data?.content?.icon?.color"
                [attr.shape]="data?.content?.icon?.iconName"
                (click)="iconClicked(data?.content)"
            ></clr-icon>{{  data?.content?.value }}</div>

            <div class="subtitle icon-container" [style]="data?.subtitleContent?.style"><clr-icon 
                *ngIf="data?.subtitleContent?.icon?.source == 'clarity'" 
                [class.icon-link]="data?.subtitleContent?.icon?.isClickable"
                [attr.title]="data?.subtitleContent?.icon?.tooltip"
                [attr.size]="data?.subtitleContent?.icon?.size"
                [style.color]="data?.subtitleContent?.icon?.color"
                [attr.shape]="data?.subtitleContent?.icon?.iconName"
                (click)="iconClicked(data?.subtitleContent)"
            ></clr-icon>{{ data?.subtitleContent?.value }}</div>
        </div>
    </div>
</div>

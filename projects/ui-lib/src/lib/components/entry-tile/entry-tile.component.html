<div class="csgp-entry-tile">
  <div class="csgp-entry-tile-title">
    <div class="csgp-generic-container-left csgp-generic-flex-row">
      <clr-icon 
          *ngIf="data.titleIcon"
          [attr.shape]="data.titleIcon"
          size="18"
        ></clr-icon>
      {{ data.title }}
    </div>
    <div class="csgp-generic-container-right">
      <div *ngIf="data.collapseMode > 0"
        class="csgp-entry-tile-collapse-button"
      >
        <clr-icon 
          [attr.shape]="data.isCollapsed ? 'angle' : 'angle' "
          [class.rotate]="data.isCollapsed"
          size="16"
          (click)="toggleCollapsedState()"
        ></clr-icon>
      </div>
    </div>
  </div>

  <div  
      class="csgp-entry-tile-base"
      [class.attention-tile]="data.state === 1"
      [class.error-tile]="data.state === 2"
      >
    <div class="csgp-entry-tile-header">
      <ng-container
        *ngFor="let headerProps of data.header; let i = index"
      >

      <div 
          *ngIf="isLoading" 
          [class.pulse]="!errorData?.hasError" 
          [class.error-blur]="errorData?.hasError"
          class="csgp-generic-container loading no-select"
        >
          <div class="csgp-generic-container-left">
            <div><ng-container *ngFor="let _ of [].constructor(3)">{{ placeholder }}</ng-container></div>
            
          </div>
          <div class="csgp-generic-container-right">
            <div><ng-container *ngFor="let _ of [].constructor(3)">{{ placeholder }}</ng-container></div>
          </div>
        </div>


        <div 
          *ngIf="!isLoading" 
          class="csgp-generic-container"
        >
          <div class="csgp-generic-container-left">
            {{ headerProps.label }}
          </div>
          <div class="csgp-generic-container-right csgp-generic-flex-row" 
          >
            <div *ngIf="headerProps.valueIcon" 
              class="csgp-entry-tile-header-value-icon"
              [attr.title]="headerProps.valueIcon.tooltip"
            >
              <clr-icon 
                  [style.color]="headerProps.valueIcon.color ? headerProps.valueIcon.color : ''"
                  [attr.shape]="headerProps.valueIcon.iconName"
                  [attr.size]="headerProps.valueIcon.size"
              ></clr-icon>
            </div>
            <div class="csgp-entry-tile-header-value"
              [style]="headerProps.valueStyle"
            >
              {{ headerProps.value }}
            </div>
          </div>
        </div>


      </ng-container>
    </div>

    <div 
      *ngIf="(data.collapseMode === 1 && !data.isCollapsed) ||  data.collapseMode !== 1"
      class="csgp-entry-tile-itemcontainer">
      <div *ngFor="let item of data.items; let j = index">

          <div 
              *ngIf="isLoading" 
              class="loading no-select"
              [class.pulse]="!errorData?.hasError" 
              [class.error-blur]="errorData?.hasError"
              >
              <div class="csgp-entry-tile-item-title loading">
                <div><ng-container *ngFor="let _ of [].constructor(5)">{{ placeholder }}</ng-container></div>
              </div>
              <div class="csgp-entry-tile-item">
                <div class="csgp-generic-container">
                  <div class="csgp-generic-container-left">
                      <div class="csgp-entry-tile-item-primary loading">
                        <div><ng-container *ngFor="let _ of [].constructor(5)">{{ placeholder }}</ng-container></div>
                      </div>
                      <div class="csgp-entry-tile-item-secondary loading">
                        <div><ng-container *ngFor="let _ of [].constructor(3)">{{ placeholder }}</ng-container></div>
                      </div>
                  </div>
                  <div class="csgp-generic-container-right">

                  </div>
                </div>
              </div>
          </div>
          <ng-container 
            *ngIf="!isLoading && data.collapseMode !== 2 || (data.collapseMode === 2 && item.state > 0 && item.state < 3)"
            >
            <div class="csgp-entry-tile-item-title">
              {{ item.title }}
            </div>

            <div 
              class="csgp-entry-tile-item" 
              [class.clickable]="item.clickable"
              [class.attention-item]="item.state === 1"
              [class.error-item]="item.state === 2"
              [class.success-item]="item.state === 3"
              (click)="tileItemClicked(item)"
              >

              <div class="csgp-generic-container">
                  <div class="csgp-generic-container-left">
                      <div class="csgp-entry-tile-item-primary">
                          {{ isLoading ? '######' : item.primaryValue }}
                        </div>
                        <div class="csgp-entry-tile-item-secondary">
                          {{ item.secondaryValue }}
                        </div>
                  </div>

                  <div class="csgp-generic-container-right">
                      <div *ngIf="item.icon" 
                        class="csgp-entry-tile-item-icon"
                        [attr.title]="item.icon.tooltip"
                      >
                          <clr-icon 
                              [style.color]="item.icon.color ? item.icon.color : ''"
                              [attr.shape]="item.icon.iconName"
                              [attr.size]="item.icon.size"
                          ></clr-icon>
                      </div>
                  </div>

              </div>
            </div>
          </ng-container>

      </div>
    </div>
  </div>
</div>

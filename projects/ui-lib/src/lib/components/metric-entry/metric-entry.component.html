<div class="csgp-metricentry">

    <div *ngIf="errorData?.hasError" class="error-overlay">
        <div>{{ errorData?.message ?? 'An error occured' }}</div>
        <div *ngIf="errorData?.showLink" (click)="errorClicked($event)" class="error-link">Show Details</div>
    </div>

    <div 
        *ngIf="isLoading" 
        class="csgp-metricentry-container-loading no-select"
        [class.pulse]="!errorData?.hasError" 
        [class.error-blur]="errorData?.hasError"
        >
        <div class="csgp-metricentry-container-left">
            <div><ng-container *ngFor="let _ of [].constructor(7)">{{ placeholder }}</ng-container></div>
        </div>
        <div class="csgp-metricentry-container-right">
            <div><ng-container *ngFor="let _ of [].constructor(7)">{{ placeholder }}</ng-container></div>
        </div>
    </div>

    <div 
        *ngIf="!isLoading"
        class="csgp-metricentry-container" 
        [class.error-blur]="errorData?.hasError"
        >
        <div class="csgp-metricentry-container-left">
            <div class="header-text icon-container" [style]="data?.label?.style">{{  data?.label?.value }}
                <clr-icon 
                    *ngIf="data?.label?.icon?.source == 'clarity'" 
                    [class.icon-link]="data?.label?.icon?.isClickable"
                    [attr.title]="data?.label?.icon?.tooltip"
                    [attr.size]="data?.label?.icon?.size"
                    [style.color]="data?.label?.icon?.color"
                    [attr.shape]="data?.label?.icon?.iconName"
                    (click)="iconClicked(data?.label)"
                ></clr-icon>
            </div>
        </div>
        <div class="csgp-metricentry-container-right" [style.color]="data?.measure?.color">
            <div class="measure-value">{{ data?.measure?.value }}</div>
            <div *ngIf="data?.measure?.percent  " class="measure-percent">({{ data?.measure?.percent }}%)</div>
        </div>
        
    </div>
    <div 
        class="csgp-metricentry-bar"
        [style.background-color]="isLoading ? 'var(--metric-bar-item-loading-bar-bg-color)' : 'lightgrey'">
        <div class="csgp-metricentry-bar"
            *ngIf="!isLoading && data?.measure?.percent"
            [style.background-color]="data?.measure?.color"
            [style.width.%]="data?.measure?.percent">
        </div>
    </div>

</div>

<div class="csgp-metricentry">

    <div *ngIf="errorData?.hasError" class="error-overlay">
        <div>{{ errorData?.message ?? 'An error occured' }}</div>
        <div *ngIf="errorData?.showLink" (click)="errorClicked($event)" class="error-link">Show Details</div>
    </div>

    <div 
        *ngIf="isLoading" 
        class="csgp-metricentry-container-loading no-select"
        [class.pulse]="!errorData?.hasError" 
        [class.error-blur]="errorData?.hasError"
        >
        <div class="csgp-metricentry-container-left">
            <div><ng-container *ngFor="let _ of [].constructor(5)">{{ placeholder }}</ng-container></div>
        </div>
        <div class="csgp-metricentry-container-right">
            <div><ng-container *ngFor="let _ of [].constructor(5)">{{ placeholder }}</ng-container></div>
        </div>
    </div>

    <div 
        *ngIf="!isLoading"
        class="csgp-metricentry-container" 
        [class.error-blur]="errorData?.hasError"
        >
        <div class="csgp-metricentry-container-left">
            <div 
                class="header-text icon-container" 
                [style]="labelStyle"
                [class.label-font-big]="!metricPercent"
                >
                {{ label }}
                <clr-icon 
                    *ngIf="labelIcon?.source == 'clarity'" 
                    [class.icon-link]="labelIcon?.isClickable"
                    [attr.title]="labelIcon?.tooltip"
                    [attr.size]="labelIcon?.size"
                    [style.color]="labelIcon?.color"
                    [attr.shape]="labelIcon?.iconName"
                    (click)="iconClicked(labelIcon)"
                ></clr-icon>
            </div>
        </div>
        <div class="csgp-metricentry-container-right" 
            [style.color]="metricColor"
            [class.label-font-big]="!metricPercent"
            >
            <div class="measure-value">{{ metricValue }}<span *ngIf="metricAdditionalLabel"> {{ metricAdditionalLabel }}</span></div>
            <div *ngIf="metricPercent && showMetricPercantageLabel" class="measure-percent">({{ metricPercent }}%)</div>
        </div>
        
    </div>
    <div 
        *ngIf="metricPercent"
        class="csgp-metricentry-bar"
        [style.background-color]="isLoading ? 'var(--metric-bar-item-loading-bar-bg-color)' : 'lightgrey'">
        <div class="csgp-metricentry-bar"
            *ngIf="!isLoading && metricPercent"
            [style.background-color]="metricColor"
            [style.width.%]="metricPercent">
        </div>
    </div>
</div>

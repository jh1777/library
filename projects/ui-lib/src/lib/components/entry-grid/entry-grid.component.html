<div class="csgp-property-grid">
    <ng-container *ngFor="let _ of [].constructor(cols); let i = index">
        <div class="csgp-property-grid-col">
            
            <!--
            Col-Index: {{ i }}
            -->

            <!-- COLS -->
            <ng-container *ngFor="let _ of [].constructor(rows); let j = index">
                <div class="csgp-property-grid-row" *ngIf="data?.items[j+(i*rows)]">
                    
                    <!--
                    Row-Index: {{ j }} <br/>
                    Index: {{ j + ( i * rows ) }}
                    -->
                    
                    <!-- ROWS -->
                    <ng-container *ngIf="data?.items[j+(i*rows)]?.component == 'PROPERTY'">
                        <csgp-property-entry 
                            [isLoading]="data?.items[j+(i*rows)]?.isLoading"
                            [id]="data?.items[j+(i*rows)]?.data?.id"
                            [label]="data?.items[j+(i*rows)]?.data?.label"
                            [labelStyle]="data?.items[j+(i*rows)]?.data?.labelStyle"
                            [labelIcon]="data?.items[j+(i*rows)]?.data?.labelIcon"

                            [value]="data?.items[j+(i*rows)]?.data?.value"
                            [valueStyle]="data?.items[j+(i*rows)]?.data?.valueStyle"
                            [valueIcon]="data?.items[j+(i*rows)]?.data?.valueIcon"

                            [subtitle]="data?.items[j+(i*rows)]?.data?.subtitle"
                            [subtitleStyle]="data?.items[j+(i*rows)]?.data?.subtitleStyle"
                            [subtitleIcon]="data?.items[j+(i*rows)]?.data?.subtitleIcon"

                            [valueSubtitle]="data?.items[j+(i*rows)]?.data?.valueSubtitle"
                            [valueSubtitleStyle]="data?.items[j+(i*rows)]?.data?.valueSubtitleStyle"
                            [valueSubtitleIcon]="data?.items[j+(i*rows)]?.data?.valueSubtitleIcon"

                            (onIconClick)="clickEvent(data?.items[j+(i*rows)])"

                            [errorData]="data?.items[j+(i*rows)]?.errorData"
                        ></csgp-property-entry>
                    </ng-container>
                    <ng-container *ngIf="data?.items[j+(i*rows)]?.component == 'METRIC'">
                        <csgp-metric-entry
                            [isLoading]="data?.items[j+(i*rows)]?.isLoading"
                            [errorData]="data?.items[j+(i*rows)]?.errorData"
                            [label]="data?.items[j+(i*rows)]?.data?.label"
                            [labelStyle]="data?.items[j+(i*rows)]?.data?.labelStyle"
                            [labelIcon]="data?.items[j+(i*rows)]?.data?.labelIcon"
                            [metricValue]="data?.items[j+(i*rows)]?.data?.metricValue"
                            [metricPercent]="data?.items[j+(i*rows)]?.data?.metricPercent"
                            [metricColor]="data?.items[j+(i*rows)]?.data?.metricColor"
                        ></csgp-metric-entry>
                    </ng-container>
                </div>
            </ng-container>
        </div>
    </ng-container>
</div>

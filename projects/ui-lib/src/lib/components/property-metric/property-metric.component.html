@if(hidden() == false) {
    <div 
        class="csgp-property-metric-bar"
>
        @if(isLoading() == true) {
            <div class="csgp-property-metric-bar loading pulse"
                [style.width.%]="100">
            </div>
        }
        @if(isLoading() == false && percent() > 0) {
            <div class="csgp-property-metric-bar"
                [class.default-bar]="style() == 0"
                [class.attention-bar]="style() == 1"
                [class.error-bar]="style() == 2"
                [class.success-bar]="style() == 3"
                [style.width.%]="percent()">
            </div>
        }
    </div>
}

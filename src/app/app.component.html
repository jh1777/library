
<div style="padding: 2rem">

  <div class="page-header">
    <div style="font-weight: 800; font-size: large;">Components Overview</div>
    <div class="header-button" (click)="showBorders = !showBorders">
      <clr-icon size="18" shape="bug"></clr-icon>
      {{ !showBorders ? 'Show' : 'Hide' }} Component borders
    </div>
  </div>
  <p></p>

  <clr-tabs>
    <clr-tab>
        <button clrTabLink>Buttons</button>
        <ng-template [(clrIfActive)]="buttonsTabActive">
            <clr-tab-content>
                <buttons-page [showComponentBorder]="showBorders"></buttons-page>
            </clr-tab-content>
        </ng-template>
    </clr-tab>

    <clr-tab>
        <button clrTabLink>Tags</button>
        <ng-template [(clrIfActive)]="tagsTabActive">
            <clr-tab-content>
              <tags-page [showComponentBorder]="showBorders"></tags-page>
            </clr-tab-content>
        </ng-template>
    </clr-tab>
  </clr-tabs>

</div>

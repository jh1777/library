
<div class="page-header">GRID</div>

<div class="item">
    <div class="title">
      GRID (containing ENTRY TILE / METRIC TILE and others)
      <div class="subtitle">
        used for layouting several ENTRY TILE / METRIC TILE etc. components in columns
      </div>
    </div>
    <ui-grid [columns]="3">
        <ui-card 
            header="Card Example #2" 
            text="Enable the advanced feature flag in this application."
            column="1"
            >
            <ui-button icon="pop-out" [style]="0" slot="header-right"></ui-button>
            <ui-switch label="Advanced" slot="footer-left"></ui-switch>
        </ui-card>

      <ui-entry-tile header="Slotted Empty Tile" collapseMode="1" column="1">
        <ui-entry-key-value
          label="Updated"
          value="50 mins ago"
          [isLoading]="false"
        ></ui-entry-key-value>
        <ui-entry-item
          primaryValue="Primary"
          secondaryValue="Subtitle"
        ></ui-entry-item>
        <ui-entry-item
          primaryValue="Attributes"
          secondaryValue="Updated"
        ></ui-entry-item>
      </ui-entry-tile>
      <ui-entry-tile header="Tile at Col 3" collapseMode="1" column="3">
        <ui-entry-item
          primaryValue="Secondary"
          secondaryValue="Subtitle"
          icon="pop-out"
          clickable="true"
        >
        </ui-entry-item>
      </ui-entry-tile>
      <ui-entry-tile header="Another Col 3" collapseMode="1" column="3">
        <ui-entry-item
          primaryValue="Connected"
          secondaryValue="Yes"
        ></ui-entry-item>
        <ui-button
          label="Delete"
          [style]="4"
          icon="trash"
          slot="right"
        ></ui-button>
        <ui-button
          label="Accept"
          [style]="5"
          icon="check"
          slot="left"
        ></ui-button>
      </ui-entry-tile>
      <ui-entry-tile header="Loading Demo" collapseMode="1" column="2">
        <ui-entry-item
          primaryValue="Attributes"
          secondaryValue="Updated"
          [isLoading]="true"
        ></ui-entry-item>
      </ui-entry-tile>
      <ui-metric-tile header="Test Metrics" column="2">
        <ui-entry-container>
          <ui-entry-key-value label="None" value="14%" [state]="1"></ui-entry-key-value>
          <ui-entry-metric [percent]="14" [style]="1" [isLoading]="false"> </ui-entry-metric>
        </ui-entry-container>
      </ui-metric-tile>
    </ui-grid>
  </div>

<div class="example-page">
    <ui-toolbar text="Example Page" [maxValueTiles]=3>

        <ui-badge label="CTP 2" [style]="badgeStyle.None" slot="left"></ui-badge>

        <ui-value-tile key="Vin" value="WDB0101010110" [style]=0 [isLoading]=false slot="left">
            <ui-button icon="copy"></ui-button>
            <ui-button icon="pop-out" [style]=0></ui-button>
        </ui-value-tile>

        <ui-value-tile key="Partners" value="3" [isLoading]=false slot="right" [style]=0 tooltip="partner1, partner2">

        </ui-value-tile>

        <ui-value-tile key="Streaming" value="ENABLED" [style]=3 [isLoading]=false slot="right"></ui-value-tile>

        <ui-button label="New Command" icon="upload-cloud" [style]=0 slot="right"></ui-button>
        <ui-button label="Refresh" icon="refresh" [style]=0 slot="right"></ui-button>
        
    </ui-toolbar>


    <ui-grid [columns]=4>

        <ui-card header="Overall Status" grid-column="1">
            <ui-card-section-basic text="The device is a good state. Just the device twin is missing 1 property to be ready for onboarding!" [style]=1>

            </ui-card-section-basic>
        </ui-card>
        <ui-entry-tile header="Onboarding" collapseMode="1" [style]=4 grid-column="1">
            <ui-entry-key-value label="State" value="Started" [style]=1  [isLoading]="false"></ui-entry-key-value>
            <ui-entry-key-value label="Updated" value="50 mins ago" [isLoading]="false"></ui-entry-key-value>

            <ui-entry-tile-item primaryValue="TLS Registration" secondaryValue="34 mins ago" [style]=0></ui-entry-tile-item>
            <ui-entry-tile-item primaryValue="IoT Hub Setup" secondaryValue="32 mins ago" [style]=0></ui-entry-tile-item>
            <ui-entry-tile-item primaryValue="Twin" secondaryValue="Incomplete, SoftwareVersion missing" [style]=1 [isLoading]=false></ui-entry-tile-item>

        </ui-entry-tile>

        <ui-entry-tile header="Onboarding" collapseMode="1" [style]=0 grid-column="2" [isCollapsed]="true">
            <ui-entry-key-value label="State" [style]=3  value="Completed" [isLoading]="false"></ui-entry-key-value>
            <ui-entry-key-value label="Updated" value="Sep 20, 2023, 11:19:00 AM GMT+2" [isLoading]="false"></ui-entry-key-value>

            <ui-entry-tile-item primaryValue="TLS Registration" secondaryValue="Sep 20, 2023, 11:12:00 AM GMT+2"></ui-entry-tile-item>
            <ui-entry-tile-item primaryValue="Twin Initialisation" tooltip="All necessary twin properties received." secondaryValue="Sep 20, 2023, 11:17:00 AM GMT+2"></ui-entry-tile-item>
            <ui-entry-tile-item primaryValue="IoT Hub Sync" secondaryValue="Sep 20, 2023, 11:19:00 AM GMT+2"></ui-entry-tile-item>
        </ui-entry-tile>

        <ui-entry-tile header="Onboarding" [collapseMode]=1 [style]=1 grid-column="2" [isCollapsed]=false>
            <ui-entry-key-value label="State" [style]=1  value="Started" [isLoading]=false></ui-entry-key-value>
            <ui-entry-key-value label="Updated" value="Sep 20, 2023, 11:19:00 AM GMT+2" [isLoading]="false"></ui-entry-key-value>

            <ui-entry-tile-item primaryValue="TLS Registration" secondaryValue="Sep 20, 2023, 11:12:00 AM GMT+2" [style]=3></ui-entry-tile-item>
            <ui-entry-tile-item primaryValue="Twin Initialisation" tooltip="Not all necessary twin properties received." secondaryValue="Waiting (<20 min)..." [style]=1></ui-entry-tile-item>
            <ui-entry-tile-item primaryValue="IoT Hub Sync" secondaryValue="Sep 20, 2023, 11:19:00 AM GMT+2"></ui-entry-tile-item>
        </ui-entry-tile>

        <ui-entry-tile header="Onboarding" [collapseMode]=1 [style]=2 grid-column="2" [isCollapsed]=false>
            <ui-entry-key-value label="State" [style]=2  value="Started" [isLoading]=false></ui-entry-key-value>
            <ui-entry-key-value label="Updated" value="Sep 20, 2023, 11:19:00 AM GMT+2" [isLoading]="false"></ui-entry-key-value>

            <ui-entry-tile-item primaryValue="TLS Registration" secondaryValue="Sep 20, 2023, 11:12:00 AM GMT+2" [style]=3></ui-entry-tile-item>
            <ui-entry-tile-item primaryValue="Twin Initialisation" tooltip="Not all necessary twin properties received." secondaryValue="Waiting (>= 20min)..." [style]=2></ui-entry-tile-item>
            <ui-entry-tile-item primaryValue="IoT Hub Sync" secondaryValue="Sep 20, 2023, 11:19:00 AM GMT+2"></ui-entry-tile-item>
        </ui-entry-tile>

    </ui-grid>
</div>

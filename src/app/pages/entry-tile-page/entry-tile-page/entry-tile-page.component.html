<!-- BUTTON with Component Store -->
<component-header title="ENTRY TILE" subtitle="with Component Store"></component-header>

<div style="display: flex; gap: .5rem;margin-bottom: .5rem;">
    <div class="button" (click)="addTestItem()">Add Item and Header</div>
    <div class="button" (click)="toggleCollapseTile()">Toggle Collapse Tile</div>
    <div class="button" (click)="gotoPage(1)">Page 2</div>
</div>

<div class="columns">
    <div class="container" *ngFor="let model of tileData">
        <div class="item">
            <div [class.debugBorder]="showComponentBorder">
                <csgp-v2-entry-tile
                    [isLoading]="model.isLoading"
                    [id]="model.id"
                    [title]="model.title"
                    [titleIcon]="model.titleIcon"
                    [collapseMode]="model.collapseMode"
                    [isCollapsed]="model.isCollapsed"
                    [state]="model.state"
                    [header]="model.header"
                    [items]="model.items"
                    [showMoreButtonLabel]="model.showMoreButtonLabel"
                    [pageSize]="model.pageSize"
                    [initializedCallBack]="initCallback"
                    (onItemClick)="setOutput(model)"
                    (onShowMoreClick)="moreClicked($event)"
                >
                </csgp-v2-entry-tile>
            </div>
        </div>
        <div class="description">
            {{ model.$description }}
        </div>
        <div class="item-output">
            {{ model.$output }}
        </div>
    </div>
</div>
